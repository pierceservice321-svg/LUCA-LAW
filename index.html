<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FILE_0112_LUCA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        :root { --paper: #c8c8c8; --ink: #1a1a1a; --accent: #800; }
        body { background: #000; color: #ccc; font-family: 'Noto Serif TC', serif; margin: 0; overflow: hidden; height: 100vh; }

        /* 窺視者背景 */
        #watcher-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://miro.medium.com/v2/resize:fit:1200/1*koUr4odA91ARVyQzpIQwjg.jpeg') center/contain no-repeat #000; 
            opacity: 0; transition: opacity 4s ease-in-out; z-index: 1;
            filter: brightness(0.4) contrast(1.5);
        }

        #gate-screen { position: fixed; z-index: 1000; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        #poem-area { line-height: 2.8; letter-spacing: 3px; color: #888; text-align: center; font-style: italic; padding: 20px; font-size: 1.1rem; min-height: 250px; }

        .report-sheet { 
            width: 90%; max-width: 500px; height: 85vh; background: var(--paper); 
            padding: 40px 30px; box-sizing: border-box; display: none; color: var(--ink); 
            position: relative; z-index: 5; transition: 2s; overflow-y: auto;
            box-shadow: 0 0 60px #000;
        }
        .report-sheet.burned { background: #050505 !important; color: #900 !important; filter: sepia(0.5) contrast(1.5); }

        #mud-up { position: fixed; bottom: -100%; left: 0; width: 100%; height: 100%; background: #1a120b; z-index: 999; transition: 2s ease-in; opacity: 0.98; }

        .input-gap { border-bottom: 2px solid var(--accent); cursor: pointer; font-weight: bold; padding: 0 5px; transition: 0.3s; }
        .active-hint { animation: pulse 1.2s infinite; color: var(--accent); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.1; } }

        #final-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 10000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            color: #700; text-align: center; padding: 20px;
        }

        #input-panel { position: fixed; bottom: 0; width: 100%; background: #0a0a0a; padding: 35px; box-sizing: border-box; display: none; z-index: 2000; border-top: 1px solid var(--accent); }
        input { width: 100%; background: none; border: none; color: #fff; text-align: center; font-size: 2.2rem; outline: none; font-family: serif; }
    </style>
</head>
<body onclick="handleInteraction()">

<div id="watcher-bg"></div>
<div id="mud-up"></div>

<div id="final-overlay">
    <h2 id="final-title" style="letter-spacing: 12px;"></h2>
    <p id="final-sub" style="font-size: 0.95rem; color: #444;"></p>
</div>

<div id="gate-screen">
    <div id="poem-area"></div>
    <div id="click-prompt" style="color:#222; font-size:0.7rem; letter-spacing:5px; margin-top:20px;">[ CLICK TO WITNESS ]</div>
</div>

<div class="report-sheet" id="doc">
    <h1 style="font-size: 1rem; border-bottom: 2px solid #333; padding-bottom: 10px; text-align: center;">臨床鑑定報告：0112 號個案</h1>
    <p style="font-size: 0.9rem; line-height: 2;">...在泥濘中反覆碾壓。當骨骼發出悶響時，眼球出現劇烈的震顫，隨後便陷入更深的解離狀態。</p>
    <p style="font-size: 0.9rem; line-height: 2;">霸凌者大聲宣稱個案根本不是人類，只是一個在火災中被遺棄、沒有靈魂的 <span class="input-gap" id="gap-DOLL" onclick="openInput('DOLL')">? ? ? ?</span>。</p>
    <p style="font-size: 0.9rem; line-height: 2;">那枚捏在右手心的家徽扣 <span class="input-gap active-hint" id="gap-V" onclick="openInput('V')">?</span>，是他在暴雨中唯一捏碎的真實，也是他在霸凌中唯一與現實連結的證據。</p>
</div>

<div id="input-panel">
    <input type="text" id="pass-field" placeholder="INPUT" autocomplete="off" spellcheck="false">
</div>

<script>
    // 修正了 Veil 的 V 大寫
    const lines = [
        "The fire consumes the secret's pale,",
        "Lifting up the crimson Veil.",
        "A single letter etched in steel,",
        "Is all the truth he'll ever feel."
    ];
    let started = false, typing = false, solved = 0, errors = 0, idleTimer, audioCtx;

    function handleInteraction() {
        if (!started) {
            started = true;
            document.getElementById('click-prompt').style.opacity = '0';
            initAudio();
            startTypewriter();
        }
        resetIdle();
    }

    async function startTypewriter() {
        if (typing) return;
        typing = true;
        const area = document.getElementById('poem-area');
        for (let line of lines) {
            for (let char of line) { 
                area.innerHTML += char; 
                await new Promise(r => setTimeout(r, 65)); 
            }
            area.innerHTML += "<br>"; 
            await new Promise(r => setTimeout(r, 450));
        }
        setTimeout(revealDoc, 1000);
    }

    function revealDoc() {
        document.getElementById('gate-screen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('gate-screen').style.display = 'none';
            document.getElementById('doc').style.display = 'block';
            resetIdle();
        }, 1000);
    }

    function resetIdle() {
        clearTimeout(idleTimer);
        if (document.getElementById('doc').style.display === 'block' && solved < 2) {
            idleTimer = setTimeout(triggerGazer, 10000); 
        }
    }

    function triggerGazer() {
        document.getElementById('watcher-bg').style.opacity = '0.9';
        document.getElementById('doc').style.opacity = '0.1';
        document.getElementById('doc').style.filter = 'blur(15px)';
        setTimeout(() => triggerFinal("THE GAZER", "他在看著你。一直都在。", "WATCHER"), 4000);
    }

    function openInput(id) {
        if (id === 'DOLL' && solved < 1) return;
        document.getElementById('input-panel').style.display = 'block';
        document.getElementById('pass-field').focus();
        window.targetKey = id;
    }

    document.getElementById('pass-field').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const val = e.target.value.toUpperCase().trim();
            if (val === window.targetKey) {
                document.getElementById('gap-' + window.targetKey).innerText = window.targetKey;
                document.getElementById('gap-' + window.targetKey).classList.remove('active-hint');
                solved++;
                if (solved === 1) document.getElementById('gap-DOLL').classList.add('active-hint');
                if (solved === 2) triggerFinal("RECALL SUCCESS", "現在，你終於看見他真正的樣子了。", "SUCCESS");
            } else {
                errors++;
                if (errors >= 3) triggerFinal("CONNECTION LOST", "回憶已溺死在泥濘中。", "DEATH");
            }
            document.getElementById('input-panel').style.display = 'none';
            e.target.value = "";
        }
    });

    function triggerFinal(title, sub, type) {
        clearTimeout(idleTimer);
        if (type === "DEATH") document.getElementById('mud-up').style.bottom = '0';
        if (type === "SUCCESS") document.getElementById('doc').classList.add('burned');
        setTimeout(() => {
            document.getElementById('final-title').innerText = title;
            document.getElementById('final-sub').innerText = sub;
            document.getElementById('final-overlay').style.display = 'flex';
        }, 1800);
    }

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = audioCtx.sampleRate * 2;
        const rainBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = rainBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        const rainSource = audioCtx.createBufferSource();
        rainSource.buffer = rainBuffer; rainSource.loop = true;
        const rainFilter = audioCtx.createBiquadFilter();
        rainFilter.type = 'lowpass'; rainFilter.frequency.value = 1000;
        const rainGain = audioCtx.createGain(); rainGain.gain.value = 0.08;
        rainSource.connect(rainFilter); rainFilter.connect(rainGain); rainGain.connect(audioCtx.destination);
        rainSource.start();
    }
</script>
</body>
</html>
