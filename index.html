<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ LUCA // LEGAL OFFICE</title>
    <style>
        :root { --bg: #000; --text: #fff; --border: #333; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', 'PingFang TC', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        
        @keyframes shake { 0% { transform: translate(3px, 3px); } 20% { transform: translate(-3px, -3px); } 100% { transform: translate(0,0); } }
        .shake { animation: shake 0.25s ease-in-out; }

        .court-container { width: 95%; max-width: 500px; border: 1px solid var(--border); background: var(--bg); box-shadow: 0 0 40px rgba(255,255,255,0.05); }
        .patience-container { padding: 15px; border-bottom: 1px solid var(--border); background: #080808; }
        .patience-bar { height: 14px; background: #222; width: 100%; border: 1px solid #444; }
        #patience-fill { height: 100%; background: #fff; width: 100%; transition: width 0.6s; }

        #chat-box { height: 400px; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 30px; }
        .msg { max-width: 85%; font-size: 1rem; line-height: 1.6; opacity: 0; transform: translateY(10px); animation: fadeInUp 0.4s forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .luca-msg { align-self: flex-start; border-left: 3px solid #fff; padding-left: 15px; }
        .luca-name { font-weight: bold; margin-bottom: 8px; font-size: 0.85rem; color: #888; letter-spacing: 2px; }
        .user-msg { align-self: flex-end; background: #fff; color: #000; padding: 12px 18px; font-weight: bold; }

        .typing { font-style: italic; color: #555; font-size: 0.85rem; padding: 10px 25px; display: none; }
        .dots::after { content: ''; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }

        /* 介面空格與按鈕優化 */
        .input-area { padding: 25px; border-top: 1px solid var(--border); background: #080808; }
        #user-input { 
            width: 100%; 
            padding: 15px; 
            border: none; 
            background: #111; 
            color: #fff; 
            outline: none; 
            font-size: 1rem; 
            border-bottom: 1px solid #444; 
            box-sizing: border-box; 
            display: block; 
            margin-bottom: 35px; /* 增加與按鈕之間的空格 */
        }
        
        #SEND_BTN { 
            width: 100% !important; 
            background-color: #fff !important; 
            color: #000 !important; 
            border: none !important; 
            padding: 20px !important; 
            cursor: pointer !important; 
            font-weight: bold !important; 
            font-size: 1.2rem !important; 
            letter-spacing: 12px !important; 
            display: block !important;
            box-sizing: border-box !important;
            transition: 0.2s;
        }
        #SEND_BTN:hover { background-color: #bbb !important; }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #555; }
    </style>
</head>
<body>

    <div class="court-container" id="main-window">
        <div class="patience-container">
            <div class="patience-bar"><div id="patience-fill"></div></div>
        </div>
        <div id="chat-box">
            <div class="msg luca-msg">
                <div class="luca-name">LUCA</div>
                <div class="luca-text">當事人，法律不保護躺在權利上睡覺的人。你想浪費我多少時間？</div>
            </div>
        </div>
        <div id="typing-indicator" class="typing">LUCA 正在撰寫法律文書<span class="dots"></span></div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Enter defense statement..." autocomplete="off">
            <button id="SEND_BTN" onclick="askAI()">SEND</button>
        </div>
    </div>

    <script>
        // 使用你剛才提供的有效 Key
        const API_KEY = 'AIzaSyBWj-NLt60452O8inHomiZJitxLBc2VQfY'; 

        let patience = 100;
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');

        async function askAI() {
            const text = userInput.value.trim();
            if (!text || patience <= 0) return;

            addMessage(text, 'user-msg');
            userInput.value = '';
            typingIndicator.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;

            patience -= text.length <= 3 ? 15 : 5;
            document.getElementById('patience-fill').style.width = Math.max(0, patience) + '%';

            try {
                // 修改為官方目前最穩定的 v1 版本路徑
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `你現在是盧卡(Luca)，毒舌冷酷律師。稱呼對方為當事人或挑戰者。嚴禁任何括號動作。法律問題請開天價。對話：${text}` }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiText = data.candidates[0].content.parts[0].text;
                
                setTimeout(() => {
                    typingIndicator.style.display = 'none';
                    addMessage(aiText, 'luca-msg');
                }, 1200);

            } catch (error) {
                console.error("LUCA API Error:", error.message);
                typingIndicator.style.display = 'none';
                addMessage(`（連線中斷：${error.message}）嘖，當事人，你的連線跟你的邏輯一樣爛。`, 'luca-msg');
            }
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.innerHTML = className === 'luca-msg' ? `<div class="luca-name">LUCA</div><div>${text}</div>` : text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') askAI(); });
    </script>
</body>
</html>
