<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FILE_0112_LUCA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');

        :root { --paper: #dcdcdc; --ink: #1a1a1a; --accent: #900; --glitch: #f00; }
        
        body { 
            background: #000; color: #ccc; font-family: 'Noto Serif TC', serif;
            margin: 0; padding: 0; overflow: hidden; height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        /* 隱藏結局的閃爍效果 */
        @keyframes flash {
            0% { background: #000; }
            5% { background: #600; }
            10% { background: #000; }
        }
        .glitch-bg { animation: flash 0.2s ease; }

        .report-sheet {
            width: 85%; max-width: 440px; height: 80vh;
            background: var(--paper); padding: 45px; box-sizing: border-box;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            position: relative; border: 1px solid #999; transform: rotate(-0.5deg);
            overflow-y: auto; display: none; color: var(--ink);
        }

        /* 隱藏報告書的特殊樣式 */
        .hidden-report { background: #1a1a1a !important; color: #900 !important; border: 2px solid #900 !important; }
        .hidden-report h1 { border-bottom: 2px solid #900 !important; }
        .hidden-report .label { color: #500 !important; }

        h1 { font-size: 1.1rem; border-bottom: 2px solid #333; padding-bottom: 12px; margin-bottom: 30px; text-align: center; letter-spacing: 6px; font-weight: 700; }
        .section { margin-bottom: 25px; font-size: 0.95rem; line-height: 2.1; border-left: 3px solid #bbb; padding-left: 15px; }
        .label { font-weight: 700; font-size: 0.75rem; color: #666; display: block; margin-bottom: 6px; letter-spacing: 1px; }

        .black-out {
            background: #111; color: #111; padding: 0 10px; cursor: pointer; transition: 0.4s;
            border-bottom: 2px solid var(--accent); letter-spacing: 5px; display: inline-block;
        }
        .active-target { animation: pulse-red 1.8s infinite; }
        @keyframes pulse-red { 0%, 100% { background: #000; } 50% { background: #400; box-shadow: 0 0 12px rgba(255,0,0,0.4); } }

        #gate-screen {
            position: fixed; z-index: 9999; width: 100%; height: 100%; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px; box-sizing: border-box; cursor: pointer;
        }
        #poem-area { max-width: 100%; line-height: 2.5; letter-spacing: 2px; color: #aaa; font-size: 1.1rem; text-align: center; font-style: italic; }
        #click-hint { font-size: 0.7rem; color: #333; margin-top: 20px; letter-spacing: 5px; }

        #input-panel {
            position: fixed; bottom: 0; width: 100%; background: #050505;
            padding: 40px; box-sizing: border-box; display: none; z-index: 6000;
            border-top: 2px solid var(--accent);
        }
        input {
            width: 100%; background: transparent; border: none; color: #fff; font-family: 'Noto Serif TC';
            font-size: 2.5rem; text-align: center; outline: none; letter-spacing: 15px;
        }
    </style>
</head>
<body onclick="handleGlobalClick()">

<div id="gate-screen">
    <div id="poem-area"></div>
    <div id="click-hint">[ CLICK TO RECALL ]</div>
</div>

<div class="report-sheet" id="doc">
    <h1 id="title-main"></h1>
    <div id="content-area"></div>
</div>

<div id="input-panel">
    <input type="text" id="pass-field" maxlength="4" placeholder="..." autocomplete="off">
</div>

<audio id="rain" src="https://assets.mixkit.co/active_storage/sfx/2526/2526-preview.mp3" loop></audio>
<audio id="fire" src="https://assets.mixkit.co/active_storage/sfx/2471/2471-preview.mp3" loop></audio>
<audio id="glitch-sfx" src="https://www.soundjay.com/communication/static-noise-01.mp3"></audio>

<script>
    const poemLines = [
        "The fire consumes the secret's pale,",
        "Lifting up the crimson veil.",
        "Through the mud and silent air,",
        "The broken doll is waiting there."
    ];

    // 正常報告書
    const normalReport = [
        { label: "臨床觀察", text: "個案在低溫環境下產生強烈的自我保護意識。 [TARGET1] 已被揭開。" },
        { label: "物件關聯", text: "他不再認為自己是人，而是一具 [TARGET2]。" }
    ];

    // 隱藏報告書（強制介入時觸發）
    const hiddenReport = [
        { label: "SYSTEM ERROR", text: "檢測到未經授權的意識介入。記憶防線已崩潰。" },
        { label: "深度禁區", text: "盧卡並未在那場大火中獲救。留下的只有被汙泥填滿的空殼。他在火光中看著你，他說：『為什麼現在才來？』" },
        { label: "最後紀錄", text: "莊園從未焚毀，火在你的心裡。" }
    ];

    let audioStarted = false;
    let isTypingPoem = false;
    let interruptCount = 0;
    let isGlitchTriggered = false;

    function handleGlobalClick() {
        if (!audioStarted) {
            audioStarted = true;
            document.getElementById('click-hint').style.display = 'none';
            document.getElementById('rain').play();
            document.getElementById('fire').play();
            startPoem();
            return;
        }

        // 如果在打字過程中狂點，觸發隱藏結局
        if (isTypingPoem) {
            interruptCount++;
            if (interruptCount >= 5 && !isGlitchTriggered) {
                triggerGlitch();
            }
        }
    }

    async function typeWriter(text, element, speed = 80) {
        for (let i = 0; i < text.length; i++) {
            if (isGlitchTriggered && isTypingPoem) return; // 中斷正常流程
            element.innerHTML += text.charAt(i);
            await new Promise(res => setTimeout(res, speed));
        }
    }

    async function startPoem() {
        isTypingPoem = true;
        const area = document.getElementById('poem-area');
        for (let line of poemLines) {
            if (isGlitchTriggered) return;
            await typeWriter(line, area, 100);
            area.innerHTML += "<br>";
            await new Promise(res => setTimeout(res, 800));
        }
        isTypingPoem = false;
        setTimeout(enterArchive, 2000);
    }

    function triggerGlitch() {
        isGlitchTriggered = true;
        document.body.classList.add('glitch-bg');
        document.getElementById('glitch-sfx').play();
        
        setTimeout(() => {
            document.getElementById('gate-screen').style.display = 'none';
            const doc = document.getElementById('doc');
            doc.classList.add('hidden-report');
            doc.style.display = 'block';
            showHiddenContent();
        }, 500);
    }

    async function showHiddenContent() {
        await typeWriter("EXTRACTED_FORBIDDEN_DATA", document.getElementById('title-main'), 50);
        const area = document.getElementById('content-area');
        for (let content of hiddenReport) {
            const sec = document.createElement('div');
            sec.className = 'section';
            area.appendChild(sec);
            const lbl = document.createElement('span');
            lbl.className = 'label';
            sec.appendChild(lbl);
            await typeWriter(content.label, lbl, 30);
            await typeWriter(content.text, sec, 20);
            await new Promise(res => setTimeout(res, 500));
        }
    }

    async function enterArchive() {
        if (isGlitchTriggered) return;
        document.getElementById('gate-screen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('gate-screen').style.display = 'none';
            document.getElementById('doc').style.display = 'block';
            // 跑正常報告書邏輯 (略，同前版本)
        }, 1000);
    }
</script>
</body>
</html>
