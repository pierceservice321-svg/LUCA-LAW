<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FILE_0112_TERMINATION_PROTOCOL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Courier+Prime&family=Crimson+Pro:italic,wght@600&display=swap');
        :root { --paper: #d1d1d1; --ink: #0a0a0a; --accent: #a00; }
        body { background: #000; color: #ccc; font-family: 'Noto Serif TC', serif; margin: 0; overflow: hidden; height: 100vh; }

        /* 門戶介面 */
        #name-gate { position: fixed; z-index: 2000; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .name-box { border: none; background: none; border-bottom: 2px solid #444; color: #fff; font-size: 1.5rem; text-align: center; outline: none; padding: 10px; width: 280px; margin-bottom: 20px; font-family: 'Courier Prime'; }
        .enter-btn { background: none; border: 1px solid #555; color: #aaa; padding: 10px 40px; cursor: pointer; letter-spacing: 5px; transition: 0.4s; }

        /* 詩歌層 */
        #gate-screen { position: fixed; z-index: 1000; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        #poem-area { margin-top: 5vh; line-height: 3; letter-spacing: 8px; color: #f0f0f0; text-align: center; font-family: 'Crimson Pro', serif; font-style: italic; }
        .poem-line { min-height: 1.5em; margin-bottom: 15px; opacity: 0; transition: opacity 0.8s; font-size: 1.3rem; }

        /* 報告文件 */
        .report-sheet { 
            width: 90%; max-width: 750px; height: 90vh; background: var(--paper); 
            padding: 70px 60px; box-sizing: border-box; display: none; color: var(--ink); 
            position: relative; z-index: 5; margin: 5vh auto; overflow-y: auto;
            border: 1px solid #777; box-shadow: inset 0 0 100px rgba(0,0,0,0.1), 0 0 80px rgba(0,0,0,0.9);
        }
        .input-gap { background: #000; color: #000; cursor: pointer; padding: 0 10px; border-bottom: 1px solid #444; display: inline-block; min-width: 60px; text-align: center; }
        .solved { background: transparent !important; color: var(--accent) !important; font-weight: bold; cursor: default; }

        /* 輸入介面 */
        #input-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.98); padding: 70px; box-sizing: border-box; display: none; z-index: 3000; border-top: 3px solid var(--accent); }
        #pass-field { width: 100%; background: none; border: none; color: #fff; text-align: center; font-size: 3.5rem; outline: none; letter-spacing: 25px; font-family: 'Courier Prime'; }

        /* 結局圖層 */
        #scare-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100000; background: #080808; display: none; align-items: center; justify-content: center; }
        .death-paper { width: 85%; max-width: 680px; background: #fff; color: #111; padding: 50px; font-family: 'Courier Prime', monospace; border: 1px solid #000; position: relative; line-height: 1.6; }
        .death-stamp { position: absolute; top: 40px; right: 40px; border: 6px solid #800; color: #800; padding: 10px 30px; font-size: 2rem; transform: rotate(15deg); font-weight: bold; }
        
        .section-box { border: 1px solid #999; padding: 20px; margin: 20px 0; background: rgba(255,255,255,0.3); }
        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>

<!-- 音訊資源 -->
<audio id="sfx-gunshot" preload="auto">
    <source src="https://cdn.discordapp.com/attachments/1484181918474833965/1502537903354548304/Gunshot_Sound_Effect_Single_Shot.mp3?ex=6a0012f7&is=69fec177&hm=9413cf0738b756957f8a9d3aaedd7e66ea2b55dbab9e62fa3828c1645cff53d8&" type="audio/mpeg">
</audio>
<audio id="sfx-rain" loop src="https://cdn.discordapp.com/attachments/1484181918474833965/1502554248154579065/Rain_Sounds_15_seconds_soundtrack.mp3?ex=6a002230&is=69fed0b0&hm=4a5d87db0a4bbd2c3a9a5f9e26ccbe9444bd943a0c81e9cfac9ebcf8f611e862&"></audio> 
<audio id="sfx-footstep" src="https://cdn.discordapp.com/attachments/1484181918474833965/1502551092221706310/Horror_Footsteps_Walking_Up_Stairs_Sound_Effect.mp3?ex=6a001f40&is=69fecdc0&hm=e484b58514f8ebb66cc15107c4f1d03a7cad16fddfb35a9cc21b2ed03a770673&"></audio>
<audio id="sfx-page" src="https://www.soundjay.com/misc/sounds/paper-flip-1.mp3"></audio>

<div id="name-gate">
    <div style="color: #666; letter-spacing: 10px; margin-bottom: 40px; font-size: 0.75rem;">AUTHENTICATION</div>
    <input type="text" id="user-name" class="name-box" placeholder="SUBJECT_NAME" maxlength="12">
    <button class="enter-btn" onclick="initSystem()">ACCESS</button>
</div>

<div id="gate-screen">
    <div id="poem-area"></div>
</div>

<div class="report-sheet" id="doc">
    <h1 id="report-title">EXPERIMENTAL PATHOLOGY REPORT</h1>
    <div id="subject-header">
        <p><strong>SUBJECT:</strong> LUCA / <strong>BIRTH:</strong> <span id="gap-1102" class="input-gap" onclick="openInput('1102')">████</span></p>
    </div>
    
    <div id="doc-content">
        <div class="section-box">
            <h2>一、 現場觀測紀錄：暴力行為</h2>
            <p>施暴者將個案推入泥坑中，其中一名領頭者踩住了個案的左手背反覆碾壓。個案並未呼救。施暴者不斷宣稱個案根本不是人類，僅僅是一個在火災中被遺棄的<strong>破布偶</strong>。</p>
        </div>

        <div class="section-box">
            <h2>二、 關鍵物證：血染的家徽</h2>
            <p>個案始終死死捏著右手心裡的一枚家徽扣。該扣具上刻有顯眼的 <span id="gap-V" class="input-gap" onclick="openInput('V')">█</span> 字標記。指縫滲出混著泥水的血跡，個案仍未鬆手。</p>
        </div>

        <div class="section-box">
            <h2>三、 最高管理權限</h2>
            <p>最高管理權限持有者：<span id="gap-VICTOR" class="input-gap" onclick="openInput('VICTOR')">██████</span>。</p>
        </div>
    </div>
</div>

<div id="input-panel">
    <input type="text" id="pass-field" autocomplete="off">
</div>

<div id="scare-layer">
    <div class="death-paper">
        <div class="death-stamp">TERMINATED</div>
        <div id="death-content"></div>
    </div>
</div>

<script>
    let playerName = "";
    let solved = {"1102":false, "V":false, "VICTOR":false};
    let errors = 0;

    function initSystem() {
        const val = document.getElementById('user-name').value.trim();
        if(!val) return;
        playerName = val;
        
        // 1. 播放雨聲
        const rain = document.getElementById('sfx-rain');
        rain.volume = 0.5;
        rain.play();

        // 2. 暴力解鎖槍聲音訊 (核心修正：強制瀏覽器紀錄播放行為)
        const gunshot = document.getElementById('sfx-gunshot');
        gunshot.volume = 0.01;
        gunshot.play().then(() => {
            gunshot.pause();
            gunshot.currentTime = 0;
            gunshot.volume = 1.0; 
        }).catch(e => console.log("Sound unlock required action"));

        document.getElementById('name-gate').style.display='none';
        document.getElementById('gate-screen').style.display='flex';
        startPoem();
    }

    async function startPoem() {
        const area = document.getElementById('poem-area');
        const lines = ["FATHER IS VICTOR", "Is your only truth"];
        for(let text of lines) {
            let d = document.createElement('div'); d.className = "poem-line"; area.appendChild(d);
            for(let char of text) { d.innerHTML += char; d.style.opacity = 1; await new Promise(r => setTimeout(r, 60)); }
            await new Promise(r => setTimeout(r, 500));
        }
        
        const hint = document.createElement('div');
        hint.style.cssText = "color:#500; font-size:0.8rem; margin-top:30px; letter-spacing:10px; animation: blink 2s infinite;";
        hint.innerText = "[ TAP TO OPEN FILE ]";
        area.appendChild(hint);

        document.getElementById('gate-screen').onclick = () => {
            document.getElementById('sfx-page').play();
            document.getElementById('gate-screen').style.display='none';
            document.getElementById('doc').style.display='block';
        };
    }

    function openInput(id) { 
        document.getElementById('input-panel').style.display='block'; 
        const field = document.getElementById('pass-field');
        field.focus(); window.targetKey = id; 
    }

    document.getElementById('pass-field').onkeypress = (e) => {
        if(e.key === 'Enter') {
            const val = e.target.value.toUpperCase().trim();
            const isCorrect = (val === window.targetKey || (window.targetKey === 'VICTOR' && (val === 'VICTOR' || val === 'FATHER')));
            
            if(isCorrect) {
                solved[window.targetKey] = true;
                document.getElementById('gap-' + window.targetKey).innerHTML = val;
                document.getElementById('gap-' + window.targetKey).className = "solved";
                document.getElementById('sfx-page').play();
                if(Object.values(solved).every(v => v)) setTimeout(triggerDiary, 800);
            } else {
                errors++;
                // 播放腳步聲警告
                const foot = document.getElementById('sfx-footstep');
                foot.currentTime = 0;
                foot.play();

                if(errors >= 3) { // 修正為錯誤三次觸發
                    triggerDeath();
                } else {
                    console.log("錯誤次數: " + errors);
                }
            }
            document.getElementById('input-panel').style.display='none'; 
            e.target.value="";
        }
    }

    function triggerDeath() {
        const gunshot = document.getElementById('sfx-gunshot');
        
        // 核心修正：強制重新加載資源並播放
        gunshot.load(); 
        gunshot.volume = 1.0;
        
        const playPromise = gunshot.play();

        if (playPromise !== undefined) {
            playPromise.then(() => {
                console.log("槍聲成功播放");
            }).catch(error => {
                console.log("槍聲被瀏覽器攔截:", error);
            });
        }

        // 視覺效果延遲出現，確保聽覺先行
        setTimeout(() => {
            document.getElementById('scare-layer').style.display = 'flex';
            document.getElementById('death-content').innerHTML = `
                <p><strong>REPORT_ID:</strong> ERR_EXP_FAIL</p>
                <p><strong>SUBJECT:</strong> ${playerName}</p>
                <p><strong>DIAGNOSIS:</strong> 顱腦槍械損傷 (Gunshot Wound)</p>
                <hr style="border:0; border-top:1px solid #ddd; margin:15px 0;">
                <p><strong>OBSERVATION:</strong><br>執行者：Victor。在第三次密碼驗證失敗後，執行清理程序。子彈貫穿枕骨，受試者立即喪失意識。</p>
            `;
        }, 100);
    }

    async function triggerDiary() {
        document.getElementById('sfx-page').play();
        const box = document.getElementById('doc-content');
        box.innerHTML = `<div id="final-diary" style="color:#b00; font-weight:bold; line-height:2.6; margin-top:20px;"></div>`;
        
        const content = [
            "【VICTOR'S PRIVATE JOURNAL】",
            "那場絕美火災是我送給 Veil 家族的『歡迎儀式』，我看著火舌吞噬宅邸就想哈哈大笑。",
            "我忘不了他跪在廢墟中呼喊父母名字的樣子，那個男孩有著和我相似的容貌，可真有利用價值。",
            "他的靈魂已經破碎，可能永遠屬於我的家族了。也許我該多給他一些考驗？",
            "他死守著『V』徽章在泥坑掙扎的模樣真是愚蠢，他也許以為還有人會來救他，其實將是我會出現在那又破又髒的孤兒院。",
            "只要他還在痛苦中掙扎，就是我最完美的標本。我真希望快點聽見他叫我『父親』。"
        ];
        
        for(let text of content) {
            let p = document.createElement('p'); document.getElementById('final-diary').appendChild(p);
            for(let char of text) { p.innerHTML += char; await new Promise(r=>setTimeout(r, 60)); }
            await new Promise(r=>setTimeout(r, 1000));
        }
    }
</script>
</body>
</html>
