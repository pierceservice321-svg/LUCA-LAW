<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ LUCA // LEGAL OFFICE</title>
    <style>
        :root { --bg: #000; --text: #fff; --border: #333; }
        body { background: var(--bg); color: var(--text); font-family: 'PingFang TC', 'Microsoft JhengHei', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        .court-container { width: 95%; max-width: 500px; border: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(255,255,255,0.05); }
        .status-bar { padding: 15px; border-bottom: 1px solid var(--border); background: #080808; }
        .patience-bar { height: 6px; background: #222; width: 100%; border-radius: 3px; overflow: hidden; }
        #patience-fill { height: 100%; background: #fff; width: 100%; transition: width 0.5s; }
        #chat-box { height: 400px; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        .msg { max-width: 85%; font-size: 0.95rem; line-height: 1.5; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .luca-msg { align-self: flex-start; border-left: 2px solid #fff; padding-left: 12px; }
        .luca-name { font-weight: bold; color: #888; font-size: 0.8rem; margin-bottom: 5px; letter-spacing: 1px; }
        .user-msg { align-self: flex-end; background: #fff; color: #000; padding: 8px 15px; font-weight: bold; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid var(--border); background: #080808; gap: 10px; }
        #user-input { flex: 1; padding: 12px; background: #111; border: none; border-bottom: 1px solid #555; color: #fff; outline: none; font-size: 1rem; }
        #send-btn { background: #fff; color: #000; border: none; padding: 0 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #send-btn:hover { background: #ccc; }
        .typing { font-size: 0.8rem; color: #555; padding: 10px 25px; display: none; }
    </style>
</head>
<body>

    <div class="court-container">
        <div class="status-bar">
            <div class="patience-bar"><div id="patience-fill"></div></div>
        </div>
        <div id="chat-box"></div>
        <div id="typing-indicator" class="typing">LUCA 正在審閱卷宗...</div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="說點有邏輯的..." autocomplete="off">
            <button id="send-btn" onclick="askAI()">SEND</button>
        </div>
    </div>

    <script>
        // 已經替換成你剛剛給我的 AbOA 金鑰
        const API_KEY = 'AIzaSyBCa79YloJmE_nyas6TsIGJ8XJSAmHAbOA'; 

        const greetings = [
            "當事人，你又打算來說些什麼廢話？",
            "法律不保護躺在權利上睡覺的人。你想浪費我多少時間？",
            "看在上帝的分上，希望你接下來要說的話值得我放下卷宗。"
        ];

        let patience = 100;
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');

        window.onload = () => {
            addMessage(greetings[Math.floor(Math.random() * greetings.length)], 'luca-msg');
        };

        async function askAI() {
            const text = userInput.value.trim();
            if (!text || patience <= 0) return;

            addMessage(text, 'user-msg');
            userInput.value = '';
            typingIndicator.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;

            patience -= 5;
            document.getElementById('patience-fill').style.width = Math.max(0, patience) + '%';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "你現在是盧卡(Luca)，一位毒舌、冷酷、充滿精英感的律師。稱呼對方為當事人。不要使用括號。對話內容：" + text }] }]
                    })
                });

                const data = await response.json();
                typingIndicator.style.display = 'none';

                if (data.error) {
                    addMessage("(連線失敗: " + data.error.message + ") 當事人，看來你的金鑰權限有問題。", "luca-msg");
                } else {
                    const aiText = data.candidates[0].content.parts[0].text;
                    addMessage(aiText, 'luca-msg');
                }

            } catch (error) {
                typingIndicator.style.display = 'none';
                addMessage("(連線中斷) 當事人，你的連線跟你的邏輯一樣脆弱。", "luca-msg");
            }
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.innerHTML = className === 'luca-msg' ? `<div class="luca-name">LUCA</div><div>${text}</div>` : text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') askAI(); });
    </script>
</body>
</html>
