<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ LUCA // FINAL TRIAL</title>
    <style>
        :root { --bg: #000; --text: #fff; --border: #333; }
        body { background: var(--bg); color: var(--text); font-family: 'PingFang TC', 'Microsoft JhengHei', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .court-container { width: 95%; max-width: 500px; border: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; }
        #chat-box { height: 400px; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        .msg { max-width: 85%; font-size: 0.95rem; line-height: 1.5; }
        .luca-msg { align-self: flex-start; border-left: 2px solid #fff; padding-left: 12px; }
        .user-msg { align-self: flex-end; background: #fff; color: #000; padding: 8px 15px; font-weight: bold; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid var(--border); background: #080808; gap: 10px; }
        input { flex: 1; padding: 12px; background: #111; border: none; color: #fff; outline: none; }
        button { background: #fff; color: #000; border: none; padding: 0 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="court-container">
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="說點有邏輯的..." autocomplete="off">
            <button onclick="askAI()">SEND</button>
        </div>
    </div>
    <script>
        const API_KEY = 'AIzaSyBCa79YloJmE_nyas6TsIGJ8XJSAmHAbOA'; 

        window.onload = () => { addMessage("當事人，這是我最後一次幫你調整連線。如果再不通，建議你重新申請一個 Google 帳號。", 'luca-msg'); };

        async function askAI() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user-msg');
            input.value = '';

            try {
                // 這裡改用基礎款 gemini-pro 模型，路徑使用 v1beta
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "你是毒舌律師盧卡(Luca)，請回覆當事人：" + text }] }]
                    })
                });

                const data = await res.json();
                if (data.error) {
                    addMessage("(診斷報告: " + data.error.message + ")", "luca-msg");
                } else {
                    addMessage(data.candidates[0].content.parts[0].text, 'luca-msg');
                }
            } catch (e) {
                addMessage("(連線中斷) 你的環境可能真的有問題。", "luca-msg");
            }
        }

        function addMessage(t, c) {
            const d = document.createElement('div');
            d.className = `msg ${c}`;
            d.innerHTML = c === 'luca-msg' ? `<b>LUCA</b><br>${t}` : t;
            document.getElementById('chat-box').appendChild(d);
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        }
    </script>
</body>
</html>
