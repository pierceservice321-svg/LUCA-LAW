<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ LUCA // LEGAL OFFICE</title>
    <style>
        :root { --bg: #000; --text: #fff; --border: #333; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', 'PingFang TC', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        
        .court-container { width: 95%; max-width: 500px; border: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(255,255,255,0.05); }
        
        .status-bar { padding: 15px; border-bottom: 1px solid var(--border); background: #080808; }
        .patience-bar { height: 10px; background: #222; width: 100%; border: 1px solid #444; }
        #patience-fill { height: 100%; background: #fff; width: 100%; transition: width 0.5s; }

        #chat-box { height: 400px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .msg { max-width: 85%; font-size: 0.95rem; line-height: 1.5; }
        .luca-msg { align-self: flex-start; border-left: 2px solid #fff; padding-left: 12px; }
        .luca-name { font-weight: bold; color: #888; font-size: 0.8rem; margin-bottom: 5px; }
        .user-msg { align-self: flex-end; background: #fff; color: #000; padding: 8px 15px; font-weight: bold; border-radius: 2px; }

        /* 側邊按鈕關鍵佈局 */
        .input-area { 
            display: flex; 
            padding: 15px; 
            border-top: 1px solid var(--border); 
            background: #080808;
            gap: 12px; 
            align-items: center;
        }
        #user-input { 
            flex: 1; 
            padding: 12px; 
            background: #111; 
            border: none; 
            border-bottom: 1px solid #555; 
            color: #fff; 
            outline: none; 
            font-size: 1rem;
        }
        #send-btn { 
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 12px 18px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.85rem;
            white-space: nowrap; 
            transition: 0.2s;
        }
        #send-btn:hover { background: #ccc; }

        .typing { font-size: 0.8rem; color: #555; padding: 5px 20px; display: none; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body>

    <div class="court-container">
        <div class="status-bar">
            <div class="patience-bar"><div id="patience-fill"></div></div>
        </div>
        <div id="chat-box">
            <div class="msg luca-msg">
                <div class="luca-name">LUCA</div>
                <div>當事人，你又打算來說些什麼廢話浪費我的法律生命？</div>
            </div>
        </div>
        <div id="typing-indicator" class="typing">LUCA 正在審閱卷宗...</div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="說點有邏輯的..." autocomplete="off">
            <button id="send-btn" onclick="askAI()">SEND</button>
        </div>
    </div>

    <script>
        // 已填入你提供的 API Key
        const API_KEY = 'AIzaSyBWj-NLt60452O8inHomiZJitxLBc2VQfY'; 

        let patience = 100;
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');

        async function askAI() {
            const text = userInput.value.trim();
            if (!text || patience <= 0) return;

            addMessage(text, 'user-msg');
            userInput.value = '';
            typingIndicator.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;

            patience -= (text.length <= 3 ? 15 : 5);
            document.getElementById('patience-fill').style.width = Math.max(0, patience) + '%';

            try {
                // 使用正式 v1 穩定路徑
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `你現在是盧卡(Luca)，毒舌冷酷精英律師。稱呼對方為當事人。嚴禁括號動作。法律諮詢請開天價。對話內容：${text}` }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || '未知錯誤');
                }

                if (!data.candidates || !data.candidates[0].content) {
                    throw new Error('AI 未能生成回應');
                }

                const aiResponse = data.candidates[0].content.parts[0].text;
                
                typingIndicator.style.display = 'none';
                addMessage(aiResponse, 'luca-msg');

            } catch (error) {
                console.error("DEBUG:", error);
                typingIndicator.style.display = 'none';
                addMessage(`(連線失敗: ${error.message}) 當事人，你的連線跟你的人格一樣不穩定。`, 'luca-msg');
            }
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.innerHTML = className === 'luca-msg' ? `<div class="luca-name">LUCA</div><div>${text}</div>` : text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') askAI(); });
    </script>
</body>
</html>
