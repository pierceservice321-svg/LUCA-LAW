<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ LUCA // LEGAL OFFICE</title>
    <style>
        :root { --bg: #000; --text: #fff; --border: #333; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', 'PingFang TC', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        
        .court-container { width: 95%; max-width: 500px; border: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(255,255,255,0.05); }
        .status-bar { padding: 15px; border-bottom: 1px solid var(--border); background: #080808; }
        .patience-bar { height: 10px; background: #222; width: 100%; border: 1px solid #444; }
        #patience-fill { height: 100%; background: #fff; width: 100%; transition: width 0.5s; }

        #chat-box { height: 400px; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        .msg { max-width: 85%; font-size: 0.95rem; line-height: 1.5; }
        .luca-msg { align-self: flex-start; border-left: 2px solid #fff; padding-left: 12px; }
        .luca-name { font-weight: bold; color: #888; font-size: 0.8rem; margin-bottom: 5px; }
        .user-msg { align-self: flex-end; background: #fff; color: #000; padding: 8px 15px; font-weight: bold; border-radius: 2px; }

        /* 側邊按鈕佈局優化 */
        .input-area { 
            display: flex; 
            padding: 15px; 
            border-top: 1px solid var(--border); 
            background: #080808; 
            gap: 12px; 
            align-items: center; 
        }
        #user-input { 
            flex: 1; 
            padding: 12px; 
            background: #111; 
            border: none; 
            border-bottom: 1px solid #555; 
            color: #fff; 
            outline: none; 
            font-size: 1rem;
            min-width: 0; /* 防止 flex 項目溢出 */
        }
        #send-btn { 
            flex-shrink: 0; /* 確保按鈕不會被壓縮 */
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 12px 20px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.85rem; 
            white-space: nowrap; 
            transition: 0.2s;
        }
        #send-btn:hover { background: #bbb; }

        .typing { font-size: 0.8rem; color: #555; padding: 5px 25px; display: none; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #333; }
    </style>
</head>
<body>

    <div class="court-container">
        <div class="status-bar">
            <div class="patience-bar"><div id="patience-fill"></div></div>
        </div>
        <div id="chat-box"></div>
        <div id="typing-indicator" class="typing">LUCA 正在撰寫法律文書...</div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="說點有邏輯的..." autocomplete="off">
            <button id="send-btn" onclick="askAI()">SEND</button>
        </div>
    </div>

    <script>
        const API_KEY = 'dMOad7JHS39kUsnkbCWD21KPRjgFRoeXxb8lKHwu'; 

        const greetings = [
            "當事人，你又打算來說些什麼廢話浪費我的法律生命？",
            "法律不保護躺在權利上睡覺的人。你想浪費我多少時間？",
            "喔？又是你。這次你的辯詞有比上次更有邏輯一點嗎？",
            "別用那種迷茫的眼神看著我，我的時間按秒計費，快點進入正題。",
            "看在上帝的分上，希望你接下來要說的話值得我放下手頭上的卷宗。"
        ];

        let patience = 100;
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');

        window.onload = () => {
            const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];
            addMessage(randomGreeting, 'luca-msg');
        };

        async function askAI() {
            const text = userInput.value.trim();
            if (!text || patience <= 0) return;

            addMessage(text, 'user-msg');
            userInput.value = '';
            typingIndicator.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;

            patience -= (text.length <= 3 ? 15 : 5);
            document.getElementById('patience-fill').style.width = Math.max(0, patience) + '%';

            try {
                const response = await fetch('https://api.cohere.ai/v1/generate', {
                    method: 'POST',
                    headers: {
                        'Authorization': `BEARER ${API_KEY}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'command-nightly',
                        prompt: `你現在是盧卡(Luca)，一位毒舌、冷酷、精英感的律師。你對當事人的愚笨感到厭煩。稱呼對方為「當事人」。嚴禁使用任何括號描述動作。對話如下：\n當事人：${text}\n盧卡：`,
                        max_tokens: 200,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                
                if (data.generations && data.generations.length > 0) {
                    const aiResponse = data.generations[0].text.trim();
                    typingIndicator.style.display = 'none';
                    addMessage(aiResponse, 'luca-msg');
                } else {
                    throw new Error("API 未回傳有效文字");
                }

            } catch (error) {
                console.error(error);
                typingIndicator.style.display = 'none';
                addMessage("(連線失敗) 當事人，看來你的連線跟你的邏輯一樣脆弱。", "luca-msg");
            }
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.innerHTML = className === 'luca-msg' ? `<div class="luca-name">LUCA</div><div>${text}</div>` : text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') askAI(); });
    </script>
</body>
</html>
