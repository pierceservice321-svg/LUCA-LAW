<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>⚖️ LUCA // 靈魂審訊室</title>
    <style>
        :root { --main-white: #ffffff; --dark-grey: #1a1a1a; }
        body { background: #000; color: var(--main-white); font-family: 'PingFang TC', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .office { width: 90%; max-width: 500px; border: 1px solid #333; padding: 40px; background: #050505; position: relative; box-shadow: 0 0 60px rgba(0,0,0,1); }
        .case-header { font-size: 0.7rem; color: #444; letter-spacing: 2px; border-bottom: 1px solid #222; margin-bottom: 30px; padding-bottom: 10px; }
        #dialogue { min-height: 140px; font-size: 1.15rem; line-height: 1.7; margin-bottom: 40px; color: #ddd; }
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: transparent; color: #888; border: 1px solid #333; padding: 15px; cursor: pointer; text-align: left; transition: 0.2s; font-size: 1rem; border-radius: 2px; display: flex; align-items: center; }
        .option-btn:hover { border-color: var(--main-white); color: var(--main-white); background: rgba(255,255,255,0.05); }
        .option-prefix { font-weight: bold; margin-right: 15px; color: #555; }
        .debt-panel { position: fixed; top: 30px; left: 30px; font-family: monospace; }
        .debt-label { font-size: 0.7rem; color: #444; }
        .debt-value { color: #ff3b3b; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="debt-panel">
        <div class="debt-label">ESTIMATED DAMAGES</div>
        <div class="debt-value">$<span id="debt">0</span></div>
    </div>

    <div class="office">
        <div class="case-header">FILE ID: #2026-LUCA-OFFICE</div>
        <div id="dialogue">（盧卡合上手中的卷宗，冷冷地看著你）<br><br>「當事人，雖然我按秒計費，但你的愚蠢程度顯然連這幾秒都不值得。說吧，你又惹了什麼麻煩？」</div>
        <div class="options-container" id="options-box">
            <button class="option-btn" onclick="nextStep('fight')"><span class="option-prefix">A.</span> 「我不小心揍了我的上司...」</button>
            <button class="option-btn" onclick="nextStep('scam')"><span class="option-prefix">B.</span> 「我好像被網路詐騙了，錢全沒了。」</button>
            <button class="option-btn" onclick="nextStep('bored')"><span class="option-prefix">C.</span> 「沒事，我只是想找你聊天。」</button>
        </div>
    </div>

    <script>
        let currentDebt = 0;
        const diagElement = document.getElementById('dialogue');
        const optContainer = document.getElementById('options-box');

        const scenario = {
            fight: {
                text: "「揍了上司？呵，雖然我很欣賞你的勇氣，但法律只看證據。你那是蓄意傷害，還是你只是想測試對方的臉皮厚度？」",
                options: [
                    { prefix: "A", t: "「是他先羞辱我的人格！」", next: "fight_lose" },
                    { prefix: "B", t: "「我當時手滑，沒控制住力道。」", next: "fight_prison" }
                ],
                fine: 50000
            },
            scam: {
                text: "「被詐騙？這種二十世紀的受騙方式竟然還能在你身上發生。看來你的大腦還停留在撥接時代。錢轉出去了嗎？」",
                options: [
                    { prefix: "A", t: "「全轉了，連下個月房租都在裡面。」", next: "scam_broke" },
                    { prefix: "B", t: "「還好，我及時發現只損失了三萬。」", next: "scam_lucky" }
                ],
                fine: 30000
            },
            bored: {
                text: "「聊天？當事人，你是覺得我的諮詢費太便宜，還是你的時間多到可以隨便揮霍？出去，或是現在付我五萬美金。」",
                options: [
                    { prefix: "A", t: "「對不起，我這就滾出辦公室。」", next: "end_run" },
                    { prefix: "B", t: "「（遞出支票）這是一百萬，請陪我聊。」", next: "end_rich" }
                ],
                fine: 50000
            },
            fight_lose: { text: "「羞辱？那叫職場指導。當事人，你準備好賠償對方的醫療費加上精神損失了嗎？我建議你直接把房子過戶給他省事。」", options: [], fine: 2000000 },
            fight_prison: { text: "「手滑？這個理由留著去跟監獄裡的獄友說吧，他們會很喜歡你這種幽默感的。尤其是當你幫他們撿肥皂的時候。」", options: [], fine: 0 },
            scam_broke: { text: "「很好，現在你唯一的價值就是作為『愚蠢案例』被寫進法律教科書。出去，別把窮酸氣帶進我的辦公室。」", options: [], fine: 999999 },
            scam_lucky: { text: "「三萬塊買個教訓，看來你的智商也就值這個價。下次再被騙，記得別來找我，直接去警察局門口哭比較快。」", options: [], fine: 10000 },
            end_run: { text: "（你灰溜溜地逃出了辦公室，背後傳來盧卡一聲冷哼。）", options: [], fine: 0 },
            end_rich: { text: "「（收下支票）...突然覺得你的邏輯也不是那麼不可救藥。坐下，我們從這場對話的『無罪化』開始聊起。」", options: [], fine: -1000000 }
        };

        function nextStep(id) {
            const node = scenario[id];
            if(!node) return;

            // 更新賠償金
            currentDebt += node.fine || 0;
            document.getElementById('debt').innerText = currentDebt.toLocaleString();

            // 更新對話與選項
            diagElement.innerHTML = node.text;
            optContainer.innerHTML = "";

            if(node.options && node.options.length > 0) {
                node.options.forEach(o => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn";
                    btn.innerHTML = `<span class="option-prefix">${o.prefix}.</span> ${o.t}`;
                    btn.onclick = () => nextStep(o.next);
                    optContainer.appendChild(btn);
                });
            } else {
                const restartBtn = document.createElement('button');
                restartBtn.className = "option-btn";
                restartBtn.innerHTML = `<span class="option-prefix">></span> 案件結束，接受審判 (重新開始)`;
                restartBtn.onclick = () => location.reload();
                optContainer.appendChild(restartBtn);
            }
        }
    </script>
</body>
</html>
