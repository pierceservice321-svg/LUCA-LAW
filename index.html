<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FILE_0112_LUCA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        :root { --paper: #dcdcdc; --ink: #1a1a1a; --accent: #900; }
        body { background: #000; color: #ccc; font-family: 'Noto Serif TC', serif; margin: 0; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        #gate-screen { position: fixed; z-index: 9999; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        #poem-area { line-height: 2.5; letter-spacing: 2px; color: #aaa; font-size: 1.1rem; text-align: center; font-style: italic; }
        #click-hint { font-size: 0.7rem; color: #444; margin-top: 20px; letter-spacing: 5px; }

        .report-sheet { width: 85%; max-width: 440px; height: 80vh; background: var(--paper); padding: 45px; box-sizing: border-box; display: none; color: var(--ink); position: relative; border: 1px solid #999; }
        .hidden-report { background: #111 !important; color: #900 !important; border: 1px solid #f00 !important; }
        h1 { font-size: 1.1rem; border-bottom: 2px solid #333; padding-bottom: 12px; margin-bottom: 30px; text-align: center; }
        .section { margin-bottom: 25px; font-size: 0.95rem; line-height: 2.1; border-left: 3px solid #bbb; padding-left: 15px; }
        .label { font-weight: 700; font-size: 0.75rem; color: #666; display: block; }
        
        @keyframes flash { 0%, 100% { background: #000; } 50% { background: #400; } }
        .glitch-active { animation: flash 0.1s infinite; }
    </style>
</head>
<body onclick="handleInteraction()">

<div id="gate-screen">
    <div id="poem-area"></div>
    <div id="click-hint">[ CLICK TO RECALL ]</div>
</div>

<div class="report-sheet" id="doc">
    <h1 id="title-main"></h1>
    <div id="content-area"></div>
</div>

<script>
    const poemLines = [
        "The fire consumes the secret's pale,",
        "Lifting up the crimson veil.",
        "Through the mud and silent air,",
        "The broken doll is waiting there."
    ];

    let audioCtx, rainNode, fireNode;
    let started = false;
    let isTyping = false;
    let clicks = 0;

    // --- 聲音合成引擎 ---
    function createRain() {
        const bufferSize = 2 * audioCtx.sampleRate,
              buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate),
              output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
        
        let whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = buffer; whiteNoise.loop = true;
        
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 1500;
        
        let gain = audioCtx.createGain();
        gain.gain.value = 0.15; // 雨聲大小

        whiteNoise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        return whiteNoise;
    }

    function createFire() {
        const bufferSize = audioCtx.sampleRate,
              buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate),
              output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

        let noise = audioCtx.createBufferSource();
        noise.buffer = buffer; noise.loop = true;

        let filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 400;

        let lfo = audioCtx.createOscillator();
        lfo.type = 'sine'; lfo.frequency.value = 2;
        let lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 0.3;

        let gain = audioCtx.createGain();
        gain.gain.value = 0.1;

        lfo.connect(lfoGain); lfoGain.connect(gain.gain);
        noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        lfo.start();
        return noise;
    }

    async function handleInteraction() {
        if (!started) {
            started = true;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            rainNode = createRain(); fireNode = createFire();
            rainNode.start(); fireNode.start();
            document.getElementById('click-hint').style.display = 'none';
            startPoem();
        } else if (isTyping) {
            clicks++;
            if (clicks > 5) triggerGlitch();
        }
    }

    async function startPoem() {
        isTyping = true;
        const area = document.getElementById('poem-area');
        for (let line of poemLines) {
            if (clicks > 5) return;
            for (let char of line) {
                if (clicks > 5) return;
                area.innerHTML += char;
                await new Promise(r => setTimeout(r, 80));
            }
            area.innerHTML += "<br>";
            await new Promise(r => setTimeout(r, 600));
        }
        isTyping = false;
        setTimeout(() => !clicks > 5 && enterDoc(), 2000);
    }

    function triggerGlitch() {
        document.body.classList.add('glitch-active');
        // 改變聲音為尖銳雜訊
        rainNode.stop();
        setTimeout(() => {
            document.getElementById('gate-screen').style.display = 'none';
            document.body.classList.remove('glitch-active');
            const doc = document.getElementById('doc');
            doc.style.display = 'block';
            doc.classList.add('hidden-report');
            document.getElementById('title-main').innerText = "SYSTEM_CRITICAL_ERROR";
            document.getElementById('content-area').innerHTML = "<div class='section'><span class='label'>WARNING</span>檔案已崩潰。他在泥沼中看著你。為什麼要點這麼快？</div>";
        }, 500);
    }

    function enterDoc() {
        document.getElementById('gate-screen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('gate-screen').style.display = 'none';
            document.getElementById('doc').style.display = 'block';
            document.getElementById('title-main').innerText = "CLINICAL_REPORT_0112";
            document.getElementById('content-area').innerHTML = "<div class='section'><span class='label'>觀察</span>個案對遺物的執著近乎瘋狂...</div>";
        }, 1000);
    }
</script>
</body>
</html>
