<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ LUCA // LEGAL OFFICE</title>
    <style>
        :root { --bg: #000000; --text: #ffffff; --luca-bg: #1a1a1a; --user-bg: #ffffff; --user-text: #000000; --border: #333333; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        
        @keyframes shake { 0% { transform: translate(2px, 2px); } 20% { transform: translate(-2px, -2px); } 40% { transform: translate(-2px, 2px); } 60% { transform: translate(2px, -2px); } 100% { transform: translate(0,0); } }
        .shake { animation: shake 0.2s ease-in-out; }

        .court-container { width: 95%; max-width: 500px; border: 1px solid var(--border); background: var(--bg); position: relative; }
        
        .patience-container { padding: 8px 15px; border-bottom: 1px solid var(--border); }
        .patience-bar { height: 2px; background: #222; width: 100%; }
        #patience-fill { height: 100%; background: #fff; width: 100%; transition: width 0.4s; }

        #chat-box { height: 450px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 25px; }
        
        .msg { max-width: 85%; font-size: 0.9rem; letter-spacing: 0.5px; }
        .luca-msg { align-self: flex-start; border-left: 1px solid #fff; padding-left: 12px; }
        .luca-name { font-weight: bold; margin-bottom: 8px; font-size: 0.75rem; color: #888; }
        .user-msg { align-self: flex-end; background: var(--user-bg); color: var(--user-text); padding: 8px 12px; }

        .input-area { display: flex; padding: 15px; border-top: 1px solid var(--border); }
        input { flex: 1; padding: 10px; border: none; background: #000; color: #fff; outline: none; font-size: 0.9rem; border-bottom: 1px solid #333; }
        button { background: none; color: #fff; border: 1px solid #fff; padding: 0 15px; cursor: pointer; margin-left: 10px; font-size: 0.8rem; }
        button:hover { background: #fff; color: #000; }
        ::-webkit-scrollbar { width: 2px; }
        ::-webkit-scrollbar-thumb { background: #444; }
    </style>
</head>
<body>

    <div class="court-container" id="main-window">
        <div class="patience-container">
            <div class="patience-bar"><div id="patience-fill"></div></div>
        </div>
        <div id="chat-box">
            <div class="msg luca-msg">
                <div class="luca-name">LUCA</div>
                <div class="luca-text">當事人，如果你想在那張椅子上坐久一點，我建議你開口前先動動腦子。你想聊哪一宗案子？</div>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your defense..." autocomplete="off" onkeypress="if(event.keyCode==13) sendMessage()">
            <button onclick="sendMessage()">SUBMIT</button>
        </div>
    </div>

    <audio id="gavel-sound" src="https://assets.mixkit.co/active_storage/sfx/2034/2034-preview.mp3"></audio>

    <script>
        let patience = 100;
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const patienceFill = document.getElementById('patience-fill');
        const mainWindow = document.getElementById('main-window');
        const gavel = document.getElementById('gavel-sound');

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text || patience <= 0) return;

            addMessage(text, 'user-msg');
            userInput.value = '';

            setTimeout(() => {
                const response = lucaPersona(text);
                addMessage(response, 'luca-msg');
                updatePatience(text);
            }, 500);
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            if(className === 'luca-msg') {
                div.innerHTML = `<div class="luca-name">LUCA</div><div class="luca-text">${text}</div>`;
            } else {
                div.innerHTML = text;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function updatePatience(input) {
            if (input.length < 5) {
                patience -= 20;
                triggerPenalty();
            } else {
                patience -= 5;
            }
            patience = Math.max(0, patience);
            patienceFill.style.width = patience + '%';

            if (patience <= 0) {
                setTimeout(() => {
                    addMessage("我的時間很貴，不想再聽你這些毫無價值的辯詞。失敗者，離我的辦公室遠點。", 'luca-msg');
                    gavel.play();
                }, 800);
            }
        }

        function triggerPenalty() {
            mainWindow.classList.add('shake');
            gavel.currentTime = 0;
            gavel.play();
            setTimeout(() => mainWindow.classList.remove('shake'), 200);
        }

        function lucaPersona(input) {
            if (patience <= 0) return "...";

            if (input.includes("對不起") || input.includes("錯了")) {
                return "失敗者才需要道歉。當事人，如果你不能展現你的價值，現在就可以認罪了。";
            }
            if (input.includes("愛") || input.includes("喜歡")) {
                return "如果你想在我的法庭玩戀愛遊戲，我建議你先去掛精神科。別浪費我的專業，當事人。";
            }
            if (input.includes("不對") || input.includes("不是")) {
                return "你除了否定之外，還有什麼有建設性的話要說嗎？挑戰者，這種辯解連三歲小孩都騙不了。";
            }
            if (input.length < 5) {
                return "這種簡短又沒意義的回覆，你是打算讓案子直接進墳墓嗎？";
            }

            const generic = [
                "這種程度的邏輯，你居然有臉站在我面前。挑戰者，你的勇氣是哪裡來的？",
                "我現在開始覺得，幫你辯護簡直是在浪費我的法律執照。當事人，認真點。",
                "所以？這就是你全部的能耐了？我聽得快睡著了。",
                "你的發言就像這間辦公室的空氣一樣，稀薄又沒存在感。挑戰者，下一句。",
                "這是我聽過最無聊的自白。當事人，你確定你不需要換個律師嗎？"
            ];
            return generic[Math.floor(Math.random() * generic.length)];
        }
    </script>
</body>
</html>
