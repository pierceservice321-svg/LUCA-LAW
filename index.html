<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ LUCA // LEGAL OFFICE</title>
    <style>
        :root { --bg: #000; --text: #fff; --border: #333; }
        body { background: var(--bg); color: var(--text); font-family: 'PingFang TC', 'Microsoft JhengHei', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        .court-container { width: 95%; max-width: 500px; border: 1px solid var(--border); background: var(--bg); display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(255,255,255,0.05); }
        .status-bar { padding: 15px; border-bottom: 1px solid var(--border); background: #080808; }
        .patience-bar { height: 6px; background: #222; width: 100%; border-radius: 3px; overflow: hidden; }
        #patience-fill { height: 100%; background: #fff; width: 100%; transition: width 0.5s; }
        #chat-box { height: 400px; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        .msg { max-width: 85%; font-size: 0.95rem; line-height: 1.5; }
        .luca-msg { align-self: flex-start; border-left: 2px solid #fff; padding-left: 12px; }
        .luca-name { font-weight: bold; color: #888; font-size: 0.8rem; margin-bottom: 5px; }
        .user-msg { align-self: flex-end; background: #fff; color: #000; padding: 8px 15px; font-weight: bold; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid var(--border); background: #080808; gap: 10px; }
        #user-input { flex: 1; padding: 12px; background: #111; border: none; border-bottom: 1px solid #555; color: #fff; outline: none; }
        #send-btn { background: #fff; color: #000; border: none; padding: 0 20px; cursor: pointer; font-weight: bold; }
        .typing { font-size: 0.8rem; color: #555; padding: 10px 25px; display: none; }
    </style>
</head>
<body>

    <div class="court-container">
        <div class="status-bar">
            <div class="patience-bar"><div id="patience-fill"></div></div>
        </div>
        <div id="chat-box"></div>
        <div id="typing-indicator" class="typing">LUCA 正在審閱卷宗...</div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="說點有邏輯的..." autocomplete="off">
            <button id="send-btn" onclick="askAI()">SEND</button>
        </div>
    </div>

    <script>
        // 已填入你剛剛給我的 AbOA 金鑰
        const API_KEY = 'AIzaSyBCa79YloJmE_nyas6TsIGJ8XJSAmHAbOA'; 

        const greetings = ["當事人，又打算浪費我的時間？", "法律不保護躺在權利上睡覺的人。", "你的辯詞有邏輯一點了嗎？"];
        let patience = 100;

        window.onload = () => { addMessage(greetings[Math.floor(Math.random() * greetings.length)], 'luca-msg'); };

        async function askAI() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text || patience <= 0) return;

            addMessage(text, 'user-msg');
            input.value = '';
            document.getElementById('typing-indicator').style.display = 'block';
            patience -= 5;
            document.getElementById('patience-fill').style.width = Math.max(0, patience) + '%';

            try {
                // 核心修復：路徑改為 v1，這是解決「Not Found」的關鍵
                const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "你現在是毒舌律師盧卡(Luca)，請冷酷地回覆當事人，不要使用括號描述動作：" + text }] }]
                    })
                });

                const data = await res.json();
                document.getElementById('typing-indicator').style.display = 'none';

                if (data.error) {
                    addMessage("(診斷報告: " + data.error.message + ")", "luca-msg");
                } else {
                    addMessage(data.candidates[0].content.parts[0].text, 'luca-msg');
                }
            } catch (e) {
                document.getElementById('typing-indicator').style.display = 'none';
                addMessage("(連線完全中斷) 當事人，你的網路真的不行。", "luca-msg");
            }
        }

        function addMessage(t, c) {
            const d = document.createElement('div');
            d.className = `msg ${c}`;
            d.innerHTML = c === 'luca-msg' ? `<div class="luca-name">LUCA</div><div>${t}</div>` : t;
            document.getElementById('chat-box').appendChild(d);
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') askAI(); });
    </script>
</body>
</html>
