<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ LUCA // FINAL VERDICT</title>
    <style>
        :root { --bg: #000; --text: #fff; --border: #333; }
        body { background: var(--bg); color: var(--text); font-family: 'PingFang TC', 'Microsoft JhengHei', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .court-container { width: 95%; max-width: 500px; border: 1px solid var(--border); background: var(--bg); box-shadow: 0 0 40px rgba(255,255,255,0.1); border-radius: 8px; overflow: hidden; }
        #chat-box { height: 450px; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; border-bottom: 1px solid var(--border); }
        .msg { max-width: 85%; font-size: 0.95rem; line-height: 1.6; }
        .luca-msg { align-self: flex-start; border-left: 3px solid #fff; padding-left: 15px; color: #eee; }
        .user-msg { align-self: flex-end; background: #fff; color: #000; padding: 10px 18px; font-weight: bold; border-radius: 20px 20px 0 20px; }
        .input-area { display: flex; padding: 20px; background: #0a0a0a; gap: 12px; }
        input { flex: 1; padding: 12px; background: #1a1a1a; border: 1px solid #444; color: #fff; outline: none; border-radius: 4px; }
        button { background: #fff; color: #000; border: none; padding: 0 25px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .loading { font-size: 0.8rem; color: #666; text-align: center; padding: 10px; display: none; }
    </style>
</head>
<body>
    <div class="court-container">
        <div id="chat-box"></div>
        <div id="loading" class="loading">正在審核當事人的邏輯...</div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="說點有法律效力的話..." autocomplete="off">
            <button onclick="askAI()">SEND</button>
        </div>
    </div>

    <script>
        const API_KEY = 'AIzaSyBCa79YloJmE_nyas6TsIGJ8XJSAmHAbOA';

        window.onload = () => { addMessage("當事人，連線路徑已重新校準。如果你現在還不跟我說話，我會控告你藐視法庭。", 'luca-msg'); };

        async function askAI() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user-msg');
            input.value = '';
            document.getElementById('loading').style.display = 'block';

            try {
                // 這是 2026 年最核心的正確路徑：v1 版本搭配 gemini-1.5-flash-latest
                const res = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash-latest:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "你現在是毒舌冷酷的精英律師盧卡(Luca)，請稱呼對方為當事人，並用極度高傲、尖酸刻薄的口氣回覆這段話，嚴禁使用括號描述動作：" + text }] }]
                    })
                });

                const data = await res.json();
                document.getElementById('loading').style.display = 'none';

                if (data.error) {
                    addMessage("(診斷報告: " + data.error.message + ")", "luca-msg");
                } else {
                    const reply = data.candidates[0].content.parts[0].text;
                    addMessage(reply, 'luca-msg');
                }
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                addMessage("(連線中斷) 你的環境防火牆太厚了，盧卡進不去。", "luca-msg");
            }
        }

        function addMessage(t, c) {
            const d = document.createElement('div');
            d.className = `msg ${c}`;
            d.innerHTML = c === 'luca-msg' ? `<b>[LUCA]</b><br>${t}` : t;
            document.getElementById('chat-box').appendChild(d);
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        }

        document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') askAI(); });
    </script>
</body>
</html>
