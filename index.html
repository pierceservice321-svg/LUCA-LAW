<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>⚖️ LUCA // 靈魂審訊室</title>
    <style>
        body { background: #000; color: #fff; font-family: 'PingFang TC', serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .office { width: 90%; max-width: 500px; border: 1px solid #222; padding: 40px; background: linear-gradient(145deg, #0a0a0a, #000); box-shadow: 0 0 50px rgba(0,0,0,1); }
        .luca-portrait { font-size: 0.7rem; color: #333; margin-bottom: 20px; border-bottom: 1px solid #111; padding-bottom: 10px; }
        #dialogue { min-height: 120px; font-size: 1.1rem; line-height: 1.6; margin-bottom: 30px; transition: 0.5s; }
        .options { display: flex; flex-direction: column; gap: 15px; }
        button { background: transparent; color: #888; border: 1px solid #333; padding: 12px; cursor: pointer; text-align: left; transition: 0.3s; font-size: 0.9rem; }
        button:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.05); }
        .money-counter { position: fixed; top: 20px; right: 20px; font-family: monospace; color: #f00; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="money-counter">賠償預估: $<span id="debt">0</span></div>

    <div class="office">
        <div class="luca-portrait">CASE FILE: #2026-UNKNOWN-SUBJECT</div>
        <div id="dialogue">（你推開了辦公室厚重的木門，盧卡在黑暗中抬起頭...）<br><br>「當事人，雖然我按秒計費，但你的愚蠢程度顯然連這幾秒都不值得。說吧，你又惹了什麼麻煩？」</div>
        <div class="options" id="options-alt">
            <button onclick="nextStep('fight')">「我不小心揍了我的上司...」</button>
            <button onclick="nextStep('scam')">「我好像被網路上的帥哥/美女詐騙了...」</button>
            <button onclick="nextStep('bored')">「我只是想找你聊天。」</button>
        </div>
    </div>

    <script>
        let debt = 0;
        const diag = document.getElementById('dialogue');
        const opt = document.getElementById('options-alt');

        const script = {
            fight: {
                text: "「揍了上司？呵，雖然我很欣賞你的勇氣，但法律只看證據。你那是蓄意傷害，還是你只是想測試對方的臉皮厚度？」",
                options: [
                    { t: "「是他先羞辱我的！」", next: "fight_lose" },
                    { t: "「我當時手滑了。」", next: "fight_prison" }
                ],
                fine: 50000
            },
            scam: {
                text: "「被詐騙？這種二十世紀的當受騙方式竟然還能在你身上發生。看來你的大腦還停留在撥接時代。錢轉出去了嗎？」",
                options: [
                    { t: "「全轉了，連學費都在裡面。」", next: "scam_broke" },
                    { t: "「還好，只轉了三萬塊。」", next: "scam_lucky" }
                ],
                fine: 30000
            },
            bored: {
                text: "「聊天？當事人，你是覺得我的諮詢費太便宜，還是你的時間真的多到可以隨便揮霍？滾出去，或是現在付我五萬美金。」",
                options: [
                    { t: "「對不起，我這就滾。」", next: "end_run" },
                    { t: "「（遞出支票）這是一百萬。」", next: "end_rich" }
                ],
                fine: 50000
            },
            fight_lose: { text: "「羞辱？那叫職場指導。當事人，你準備好賠償對方的醫療費加上精神損失了嗎？我建議你直接把房子過戶給他。」", options: [], fine: 2000000 },
            fight_prison: { text: "「手滑？這個理由去跟監獄裡的獄友說吧，他們會很喜歡你這種幽默感的。」", options: [], fine: 0 },
            scam_broke: { text: "「很好，現在你唯一的價值就是作為『愚蠢案例』被寫進法律教科書。出去，別把窮酸氣帶進我的辦公室。」", options: [], fine: 9999999 },
            end_rich: { text: "「（收下支票）...突然覺得你的邏輯也不是那麼不可救藥。坐下，我們從這場官司的『無罪化』開始聊起。」", options: [], fine: -1000000 }
        };

        function nextStep(stepId) {
            const node = script[stepId];
            if(!node) return;

            debt += node.fine || 0;
            document.getElementById('debt').innerText = debt.toLocaleString();

            diag.style.opacity = 0;
            setTimeout(() => {
                diag.innerHTML = node.text;
                diag.style.opacity = 1;
                
                opt.innerHTML = "";
                if(node.options && node.options.length > 0) {
                    node.options.forEach(o => {
                        const b = document.createElement('button');
                        b.innerText = o.t;
                        b.onclick = () => nextStep(o.next);
                        opt.appendChild(b);
                    });
                } else {
                    const r = document.createElement('button');
                    r.innerText = "結局：接受審判 (重新開始)";
                    r.onclick = () => location.reload();
                    opt.appendChild(r);
                }
            }, 3000); // 延遲 300 毫秒增加儀式感
        }
    </script>
</body>
</html>
