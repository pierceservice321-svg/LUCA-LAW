<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ LUCA // LEGAL OFFICE (AI MODE)</title>
    <style>
        :root { --bg: #000; --text: #fff; --border: #333; --luca-line: #fff; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', 'PingFang TC', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        
        @keyframes shake { 0% { transform: translate(3px, 3px); } 20% { transform: translate(-3px, -3px); } 100% { transform: translate(0,0); } }
        .shake { animation: shake 0.25s ease-in-out; }

        .court-container { width: 95%; max-width: 500px; border: 1px solid var(--border); background: var(--bg); box-shadow: 0 0 50px rgba(255,255,255,0.05); position: relative; }
        .patience-container { padding: 15px; border-bottom: 1px solid var(--border); background: #080808; }
        .patience-label { font-size: 10px; font-weight: bold; margin-bottom: 8px; letter-spacing: 2px; color: #888; }
        .patience-bar { height: 14px; background: #222; width: 100%; border: 1px solid #444; }
        #patience-fill { height: 100%; background: #fff; width: 100%; transition: width 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28); }

        #chat-box { height: 420px; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 30px; scroll-behavior: smooth; }
        .msg { max-width: 85%; font-size: 1rem; line-height: 1.6; opacity: 0; transform: translateY(10px); animation: fadeInUp 0.4s forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .luca-msg { align-self: flex-start; border-left: 3px solid var(--luca-line); padding-left: 15px; }
        .luca-name { font-weight: bold; margin-bottom: 10px; font-size: 0.85rem; color: #888; letter-spacing: 2px; }
        .user-msg { align-self: flex-end; background: #fff; color: #000; padding: 12px 18px; font-weight: bold; border-radius: 2px; }

        .typing { font-style: italic; color: #555; font-size: 0.85rem; padding: 10px 25px; display: none; align-self: flex-start; }
        .dots::after { content: ''; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }

        /* 加大加寬的輸入與按鈕區 */
        .input-area { display: flex; flex-direction: column; padding: 15px; border-top: 1px solid var(--border); background: #080808; gap: 10px; }
        input { width: 100%; padding: 15px; border: none; background: #111; color: #fff; outline: none; font-size: 1rem; border-bottom: 1px solid #444; box-sizing: border-box; }
        button { width: 100%; background: #fff; color: #000; border: none; padding: 15px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; letter-spacing: 4px; }
        button:hover { background: #bbb; }
        button:active { transform: scale(0.98); }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #555; }
    </style>
</head>
<body>

    <div class="court-container" id="main-window">
        <div class="patience-container">
            <div class="patience-label">STATUS: LUCA'S PATIENCE</div>
            <div class="patience-bar"><div id="patience-fill"></div></div>
        </div>
        <div id="chat-box">
            <div class="msg luca-msg">
                <div class="luca-name">LUCA</div>
                <div class="luca-text">當事人，法律不保護躺在權利上睡覺的人。你想浪費我多少時間？</div>
            </div>
        </div>
        <div id="typing-indicator" class="typing">LUCA 正在撰寫法律文書<span class="dots"></span></div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="輸入你的反駁..." autocomplete="off">
            <button onclick="askAI()">SUBMIT STATEMENT</button>
        </div>
    </div>

    <audio id="sound-gavel" src="https://cdn.pixabay.com/audio/2022/03/10/audio_c3507e1554.mp3"></audio>
    <audio id="sound-click" src="https://cdn.pixabay.com/audio/2022/03/15/audio_783861287b.mp3"></audio>

    <script>
        const API_KEY = 'AIzaSyBCa79YloJmE_nyas6TsIGJ8XJSAmHAbOA'; // 請確認此 Key 無誤
        let patience = 100;
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');
        const sndGavel = document.getElementById('sound-gavel');
        const sndClick = document.getElementById('sound-click');

        async function askAI() {
            const text = userInput.value.trim();
            if (!text || patience <= 0) return;

            sndClick.currentTime = 0;
            sndClick.play();
            addMessage(text, 'user-msg');
            userInput.value = '';
            
            typingIndicator.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;

            if (text.length <= 3) {
                patience -= 15;
                triggerPenalty();
            } else {
                patience -= 5;
            }
            updatePatienceUI();

            const minWait = new Promise(resolve => setTimeout(resolve, 2000));

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `你現在扮演盧卡（Luca），一個精英律師。性格：毒舌、懶散、精英主義。規則：1.稱呼為當事人、挑戰者、失敗者。2.嚴禁括號動作。3.諮詢法律請開天價。對話內容：${text}` }] }]
                    })
                });

                if (!response.ok) throw new Error('API_RESPONSE_NOT_OK');

                const data = await response.json();
                if (!data.candidates || data.candidates.length === 0) throw new Error('NO_AI_RESPONSE');
                
                const aiText = data.candidates[0].content.parts[0].text;
                
                await minWait;
                typingIndicator.style.display = 'none';
                addMessage(aiText, 'luca-msg');

            } catch (error) {
                console.error("AI Error:", error);
                await minWait;
                typingIndicator.style.display = 'none';
                addMessage("嘖，律師事務所的連線出了點問題。當事人，你最好祈禱我下次還有耐心見你。", 'luca-msg');
            }
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.innerHTML = className === 'luca-msg' 
                ? `<div class="luca-name">LUCA</div><div class="luca-text">${text}</div>` 
                : text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function updatePatienceUI() {
            document.getElementById('patience-fill').style.width = patience + '%';
            if (patience <= 0) {
                setTimeout(() => addMessage("我的時間很貴，不想再聽你這些廢話。失敗者，離我的辦公室遠點。", 'luca-msg'), 1000);
            }
        }

        function triggerPenalty() {
            document.getElementById('main-window').classList.add('shake');
            sndGavel.currentTime = 0;
            sndGavel.play();
            setTimeout(() => document.getElementById('main-window').classList.remove('shake'), 250);
        }

        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') askAI(); });
    </script>
</body>
</html>
