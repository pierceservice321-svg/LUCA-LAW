<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ LUCA // LEGAL OFFICE (AI MODE)</title>
    <style>
        :root { --bg: #000; --text: #fff; --border: #333; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', 'PingFang TC', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow: hidden; }
        
        @keyframes shake { 0% { transform: translate(3px, 3px); } 20% { transform: translate(-3px, -3px); } 100% { transform: translate(0,0); } }
        .shake { animation: shake 0.25s ease-in-out; }

        .court-container { width: 95%; max-width: 500px; border: 1px solid var(--border); background: var(--bg); position: relative; box-shadow: 0 0 40px rgba(255,255,255,0.05); }
        .patience-container { padding: 15px; border-bottom: 1px solid var(--border); background: #080808; }
        .patience-bar { height: 14px; background: #222; width: 100%; border: 1px solid #444; }
        #patience-fill { height: 100%; background: #fff; width: 100%; transition: width 0.6s; }

        #chat-box { height: 400px; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 30px; }
        .msg { max-width: 85%; font-size: 1rem; line-height: 1.6; opacity: 0; transform: translateY(10px); animation: fadeInUp 0.4s forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .luca-msg { align-self: flex-start; border-left: 3px solid #fff; padding-left: 15px; }
        .luca-name { font-weight: bold; margin-bottom: 8px; font-size: 0.85rem; color: #888; letter-spacing: 2px; }
        .user-msg { align-self: flex-end; background: #fff; color: #000; padding: 12px 18px; font-weight: bold; }

        .typing { font-style: italic; color: #555; font-size: 0.85rem; padding: 10px 25px; display: none; }
        .dots::after { content: ''; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }

        /* 調整空格與按鈕設計 */
        .input-area { display: flex; flex-direction: column; padding: 20px; border-top: 1px solid var(--border); background: #080808; gap: 15px; }
        input { width: 100%; padding: 15px; border: none; background: #111; color: #fff; outline: none; font-size: 1rem; border-bottom: 1px solid #444; box-sizing: border-box; }
        
        .send-btn { width: 100%; background: #fff; color: #000; border: none; padding: 18px; cursor: pointer; font-weight: bold; font-size: 1.1rem; letter-spacing: 8px; transition: 0.2s; }
        .send-btn:hover { background: #bbb; }
        .send-btn:active { transform: scale(0.98); }

        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: #555; }
    </style>
</head>
<body>

    <div class="court-container" id="main-window">
        <div class="patience-container">
            <div class="patience-bar"><div id="patience-fill"></div></div>
        </div>
        <div id="chat-box">
            <div class="msg luca-msg">
                <div class="luca-name">LUCA</div>
                <div class="luca-text">當事人，法律不保護躺在權利上睡覺的人。你想浪費我多少時間？</div>
            </div>
        </div>
        <div id="typing-indicator" class="typing">LUCA 正在撰寫法律文書<span class="dots"></span></div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Enter your defense..." autocomplete="off">
            <button class="send-btn" onclick="askAI()">SEND</button>
        </div>
    </div>

    <audio id="sound-gavel" src="https://cdn.pixabay.com/audio/2022/03/10/audio_c3507e1554.mp3"></audio>

    <script>
        // 請確保引號內沒有任何空白
        const API_KEY = 'AIzaSyBCa79YloJmE_nyas6TsIGJ8XJSAmHAbOA'; 

        let patience = 100;
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');
        const sndGavel = document.getElementById('sound-gavel');

        async function askAI() {
            const text = userInput.value.trim();
            if (!text || patience <= 0) return;

            addMessage(text, 'user-msg');
            userInput.value = '';
            typingIndicator.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;

            if (text.length <= 3) {
                patience -= 15;
                document.getElementById('main-window').classList.add('shake');
                sndGavel.currentTime = 0;
                sndGavel.play();
                setTimeout(() => document.getElementById('main-window').classList.remove('shake'), 250);
            } else {
                patience -= 5;
            }
            document.getElementById('patience-fill').style.width = Math.max(0, patience) + '%';

            const minWait = new Promise(resolve => setTimeout(resolve, 1800));

            try {
                // 使用最新 V1 版本的請求
                const url = `https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent?key=${API_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: "user", parts: [{ text: `你現在是盧卡(Luca)，毒舌、冷酷、精英律師。稱呼對方為當事人或失敗者。嚴禁括號動作。法律問題請開天價。對話：${text}` }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.status || 'API_ERROR');
                }

                const aiText = data.candidates[0].content.parts[0].text;
                
                await minWait;
                typingIndicator.style.display = 'none';
                addMessage(aiText, 'luca-msg');

            } catch (error) {
                console.error("Debug Info:", error);
                await minWait;
                typingIndicator.style.display = 'none';
                addMessage(`嘖，連線斷了(${error.message})。當事人，你最好祈禱我下次還有耐心見你。`, 'luca-msg');
            }
        }

        function addMessage(text, className) {
            const div = document.createElement('div');
            div.className = `msg ${className}`;
            div.innerHTML = className === 'luca-msg' ? `<div class="luca-name">LUCA</div><div>${text}</div>` : text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') askAI(); });
    </script>
</body>
</html>
